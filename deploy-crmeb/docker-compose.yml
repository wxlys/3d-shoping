name: crmeb3d

services:
  mysql:
    image: docker.m.daocloud.io/library/mysql:5.7
    container_name: crmeb3d-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "Crmeb@2026"
      MYSQL_DATABASE: "crmeb"
      TZ: "Asia/Shanghai"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --sql-mode=NO_ENGINE_SUBSTITUTION
    ports:
      - "127.0.0.1:13306:3306"
    volumes:
      - crmeb3d-mysql-data:/var/lib/mysql
      - ./sql/crmeb.sql:/docker-entrypoint-initdb.d/crmeb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -pCrmeb@2026 --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: crmeb3d-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - crmeb3d-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  php:
    build:
      context: .
      dockerfile: Dockerfile.php
    container_name: crmeb3d-php
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./crmeb:/var/www/html
      - ./app.env:/var/www/html/.env:ro
    environment:
      TZ: "Asia/Shanghai"
    command: ["sh", "-c", "touch /var/www/html/public/install.lock && rm -f /var/www/html/public/install/install.lock && chown -R www-data:www-data /var/www/html/runtime /var/www/html/public/uploads 2>/dev/null || true && php-fpm"]

  nginx:
    image: docker.m.daocloud.io/library/nginx:1.25-alpine
    container_name: crmeb3d-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "18080:80"
    volumes:
      - ./crmeb:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    environment:
      TZ: "Asia/Shanghai"

volumes:
  crmeb3d-mysql-data:
  crmeb3d-redis-data:
